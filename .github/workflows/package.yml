name: Build and verify Roku sideload package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install artwork dependency
        run: python -m pip install 'Pillow>=10,<13'
      - name: Build Roku package and generate art
        run: python tools/build.py
      - name: Validate code, prompts, artwork and ZIP
        run: python tools/check.py
      - name: Upload sideload ZIP and store poster
        uses: actions/upload-artifact@v4
        with:
          name: SofaSpark-Roku-package
          path: |
            dist/SofaSpark-Party-Roku.zip
            images/store-poster.png
          if-no-files-found: error
